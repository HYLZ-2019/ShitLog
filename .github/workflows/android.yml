name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check repository files
        run: python3 scripts/check_repository.py

      - name: Test release tools
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'build-tools;36.1.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build, test, lint, and compile device tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --console=plain

      - name: Check dependency license inventory
        run: python3 scripts/dependency_inventory.py --check

      - name: Save test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  signed-build:
    name: Build with fixed signing identity
    needs: checks
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tag and version history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore fixed signing key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lunhui-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare_release_signing.py

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'build-tools;36.1.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build and lint signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lunhui-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --console=plain --no-configuration-cache

      - name: Verify identity, version, and release dependencies, then package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_prerelease.py --tag "$RELEASE_TAG"

      - name: Save checked release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prerelease-files
          path: app/build/outputs/prerelease/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: ${{ always() }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lunhui-release.jks
        run: python3 scripts/prepare_release_signing.py --cleanup

  prerelease:
    name: Publish signed prerelease
    needs: signed-build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download checked files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prerelease-files
          path: prerelease

      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd prerelease && sha256sum --check --strict SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" \
            prerelease/*.apk prerelease/*-source.zip prerelease/SHA256SUMS.txt prerelease/RELEASE_MANIFEST.json \
            --verify-tag --draft --prerelease --latest=false \
            --title "轮回记录 $RELEASE_TAG（实验版）" \
            --notes-file prerelease/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
